plugins {
    id 'com.android.application' version '8.13.2'
    id 'org.jetbrains.kotlin.android' version '2.2.21'
}
android {
    namespace 'tk.hacker1024.epimetheus.melodica'
    compileSdk 36
    defaultConfig {
        applicationId 'st.spacegho.melodica.epimetheus.kotlin'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
    }
    sourceSets.main {
        res.srcDirs = ['res']
        manifest.srcFile 'AndroidManifest.xml'
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    ndkVersion '27.0.12077973'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
kotlin { jvmToolchain(17) }
